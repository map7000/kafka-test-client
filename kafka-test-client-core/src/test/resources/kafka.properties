bootstrap.servers=localhost:9092
security.protocol=PLAINTEXT
kafka.cluster.name=test-cluster
key.serializer=org.apache.kafka.common.serialization.StringSerializer
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.serializer=org.apache.kafka.common.serialization.StringSerializer
value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
group.id=TEST_GROUP
enable.auto.commit=true
auto.commit.interval.ms=250
auto.offset.reset=earliest
# Fast failure detection: a dead member (e.g. a killed test JVM) must not hold the
# consumer group for the default 45s session timeout, as the next consumer's rebalance
# would wait just as long.
session.timeout.ms=10000
heartbeat.interval.ms=3000
client.id=test_java_client
retries=5
heartbeat.interval.ms=500